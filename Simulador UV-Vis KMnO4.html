<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador UV-Vis KMnO4 (Control Preciso)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Arial', sans-serif; padding: 20px; background-color: #f8f9fa; }
        
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        .panel { 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .left { flex: 1; height: 500px; overflow-y: auto; }
        .right { flex: 2; height: 500px; position: relative; }

        .controls { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            margin-bottom: 20px; 
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none; 
            -webkit-user-select: none; /* Safari/Mobile */
        }

        button:active { transform: scale(0.98); }

        #btnMedir { background-color: #6200ea; color: white; flex: 2; }
        #btnMedir:hover { background-color: #3700b3; }
        #btnMedir:disabled { background-color: #ccc; cursor: not-allowed; }

        #btnReset { background-color: #d32f2f; color: white; flex: 1; }
        #btnReset:hover { background-color: #b71c1c; }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: #e9ecef; padding: 10px; position: sticky; top: 0; }
        td { border-bottom: 1px solid #ddd; padding: 8px; font-family: monospace; }
        .highlight { background-color: #e1bee7; } 

        h2 { text-align: center; margin-bottom: 5px; }
        #monitor { text-align: center; font-size: 1.2em; color: #555; margin-bottom: 10px; font-weight: bold; }
        .instruction { text-align: center; font-size: 0.9em; color: #777; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Simulador Espectrofotómetro</h2>
    <div id="monitor">Estado: Listo (700 nm)</div>
    <div class="instruction">Haz clic para leer 1 dato o mantén presionado para barrido continuo.</div>

    <div class="controls">
        <button id="btnMedir" 
            onmousedown="iniciarBarrido()" 
            onmouseup="detenerBarrido()" 
            onmouseleave="detenerBarrido()"
            ontouchstart="iniciarBarrido()" 
            ontouchend="detenerBarrido()">
            MANTENER PARA LEER (700 nm)
        </button>

        <button id="btnReset" onclick="resetearTodo()">RESET</button>
    </div>

    <div class="container">
        <div class="panel left">
            <table id="tablaResultados">
                <thead>
                    <tr><th>Longitud de Onda (nm)</th><th>Absorbancia</th></tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>

        <div class="panel right">
            <canvas id="miGrafica"></canvas>
        </div>
    </div>

<script>
    // --- VARIABLES ---
    let lambda = 700;
    const lambdaFin = 400;
    let chartInstance = null;
    
    // Variables de control de tiempo (Timer IDs)
    let barridoInterval = null; 
    let inicioDelay = null;

    // --- MODELO MATEMÁTICO ---
    function getAbs(nm) {
        let y = 0;
        y += 0.55 * Math.exp(-0.5 * Math.pow((nm - 525) / 10, 2)); 
        y += 0.42 * Math.exp(-0.5 * Math.pow((nm - 545) / 9, 2));  
        y += 0.40 * Math.exp(-0.5 * Math.pow((nm - 505) / 9, 2));  
        y += 0.20 * Math.exp(-0.5 * Math.pow((nm - 570) / 12, 2)); 
        return (y < 0.002) ? 0 : y;
    }

    // --- INICIALIZAR ---
    window.onload = function() {
        const ctx = document.getElementById('miGrafica').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Absorbancia',
                    data: [],
                    borderColor: 'purple',
                    backgroundColor: 'rgba(128, 0, 128, 0.2)',
                    borderWidth: 2,
                    showLine: true,
                    pointRadius: 2,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, 
                scales: {
                    x: { type: 'linear', min: 400, max: 700, title: { display: true, text: 'Longitud de Onda (nm)' } },
                    y: { min: 0, max: 0.7, title: { display: true, text: 'Absorbancia' } }
                }
            }
        });
    };

    // --- LÓGICA DE CONTROL (EL "CEREBRO" DEL BOTÓN) ---
    
    function iniciarBarrido() {
        // Evitar múltiples disparos si ya está corriendo
        if (inicioDelay || barridoInterval) return; 
        
        // 1. Lectura INMEDIATA (El primer clic siempre cuenta)
        tomarLectura();

        // 2. Programar el barrido continuo CON RETARDO
        // Solo si el usuario mantiene presionado por más de 400ms, arranca la ráfaga
        inicioDelay = setTimeout(() => {
            barridoInterval = setInterval(tomarLectura, 100); // 100ms por dato (velocidad controlable)
        }, 400); 
    }

    function detenerBarrido() {
        // Cancelar el inicio automático si el usuario soltó rápido (fue solo un clic)
        if (inicioDelay) {
            clearTimeout(inicioDelay);
            inicioDelay = null;
        }
        // Detener el barrido si estaba andando
        if (barridoInterval) {
            clearInterval(barridoInterval);
            barridoInterval = null;
        }
    }

    function tomarLectura() {
        if (lambda < lambdaFin) {
            detenerBarrido();
            document.getElementById('monitor').innerText = "Barrido finalizado.";
            document.getElementById('btnMedir').disabled = true;
            document.getElementById('btnMedir').innerText = "FIN";
            return;
        }

        const val = getAbs(lambda);
        
        // Actualizar Tabla
        const tbody = document.getElementById('cuerpoTabla');
        const row = document.createElement('tr');
        row.innerHTML = `<td>${lambda}</td><td>${val.toFixed(3)}</td>`;
        row.className = "highlight";
        if (tbody.firstChild) tbody.firstChild.classList.remove('highlight');
        tbody.insertBefore(row, tbody.firstChild);

        // Actualizar Gráfica
        if (chartInstance) {
            chartInstance.data.datasets[0].data.push({x: lambda, y: val});
            chartInstance.data.datasets[0].data.sort((a, b) => a.x - b.x);
            chartInstance.update('none');
        }

        // Interfaz
        document.getElementById('monitor').innerText = `Leyendo: ${lambda} nm | Abs: ${val.toFixed(3)}`;
        
        lambda--; 
        
        if (lambda >= lambdaFin) {
            document.getElementById('btnMedir').innerText = `MANTENER (${lambda} nm)`;
        }
    }

    // --- RESET ---
    function resetearTodo() {
        detenerBarrido();
        lambda = 700;
        document.getElementById('cuerpoTabla').innerHTML = '';
        if (chartInstance) {
            chartInstance.data.datasets[0].data = [];
            chartInstance.update();
        }
        document.getElementById('btnMedir').disabled = false;
        document.getElementById('btnMedir').innerText = "MANTENER PARA LEER (700 nm)";
        document.getElementById('monitor').innerText = "Sistema Reiniciado (700 nm)";
    }
</script>

</body>
</html>
